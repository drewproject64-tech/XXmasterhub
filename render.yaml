services:
  - type: worker
    name: gold-master-hub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/gold_master_hub.db
